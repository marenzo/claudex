name: Release binaries
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan release for current main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          remote_head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'Superseded main revision; skipping release.'
            exit 0
          fi
          python3 .github/scripts/release.py
      - name: Check for an already published release
        id: state
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if release=$(gh release view "$VERSION" --json isDraft 2>/dev/null); then
            if [ "$(printf '%s' "$release" | jq -r .isDraft)" = false ]; then
              echo 'Release is already published; leaving its assets unchanged.'
              exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.state.outputs.publish == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archives and checksums
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          for goos in linux darwin; do
            for goarch in amd64 arm64; do
              archive="release/claudex-${VERSION}-${goos}-${goarch}.tar.gz"
              GOOS="$goos" GOARCH="$goarch" make package VERSION="$VERSION" ARCHIVE="$archive"
              tar -tzf "$archive" >/dev/null
            done
          done
          cd release
          sha256sum claudex-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest build provenance
        if: steps.state.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/claudex-*.tar.gz
      - name: Tag and publish release
        if: steps.state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          remote_head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'Main advanced during build; skipping publication.'
            exit 0
          fi
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$VERSION")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$VERSION" "$GITHUB_SHA" -m "Claudex $VERSION"
            git push origin "refs/tags/$VERSION"
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --draft --verify-tag --title "Claudex $VERSION" --notes-file release/NOTES.md
          fi
          gh release upload "$VERSION" release/claudex-*.tar.gz release/SHA256SUMS --clobber
          gh release edit "$VERSION" --draft=false --latest --notes-file release/NOTES.md
